[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "socc"
version = "1.0.0"
requires-python = ">=3.9"
description = "Sovereign Ontological Operating Core — single-command runtime"

[project.scripts]
socc = "socc_cli.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["socc_cli*"]
