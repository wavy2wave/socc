<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="Марк mark">
  <title>Марк — barbershop mark</title>
  <rect width="120" height="120" rx="28" fill="#2A2724"/>
  <!-- three fresh lines / comb teeth -->
  <line x1="44" y1="34" x2="44" y2="86" stroke="#EFE7DC" stroke-width="8" stroke-linecap="round"/>
  <line x1="60" y1="34" x2="60" y2="86" stroke="#C77F4E" stroke-width="8" stroke-linecap="round"/>
  <line x1="76" y1="34" x2="76" y2="86" stroke="#EFE7DC" stroke-width="8" stroke-linecap="round"/>
</svg>
