<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>ANNA · Форма заявки</title>
<style>
  :root{--bg:#F5F3EE;--surface:#fff;--surface2:#EDEAE3;--ink:#2E3D34;--muted:#6E7B71;--primary:#54705C;--primary-soft:#8AA897;--accent:#D9A679;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;line-height:1.5;display:flex;min-height:100vh;align-items:center;justify-content:center;padding:24px}
  .card{background:var(--surface);border-radius:22px;box-shadow:0 1px 0 rgba(46,61,52,.05),0 16px 44px rgba(46,61,52,.08);max-width:440px;width:100%;padding:34px;position:relative;overflow:hidden}
  .brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:20px;margin-bottom:6px}
  h1{font-size:23px;letter-spacing:-.6px;margin:8px 0 4px}
  p.sub{color:var(--muted);margin:0 0 22px;font-size:14.5px}
  label{display:block;font-size:13px;color:var(--muted);margin:14px 0 5px}
  input,select{width:100%;border:1.5px solid var(--surface2);background:#fff;border-radius:12px;padding:13px 15px;font:15px Inter;color:var(--ink);transition:border-color .2s}
  input:focus,select:focus{outline:none;border-color:var(--primary-soft)}
  .btn{width:100%;margin-top:22px;background:var(--primary);color:#fff;border:none;border-radius:12px;padding:15px;font:600 16px Inter;cursor:pointer;transition:transform .2s,box-shadow .2s}
  .btn:hover{transform:translateY(-2px);box-shadow:0 12px 26px rgba(46,61,52,.18)}
  .promise{text-align:center;font-size:13px;color:var(--muted);margin-top:14px}
  .ph{font-size:11px;color:#7a571f;background:#f3e7d2;border-radius:6px;padding:2px 8px}
  /* thank you */
  .ty{position:absolute;inset:0;background:var(--surface);display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:34px;opacity:0;transition:opacity .5s}
  .ty.on{display:flex;opacity:1}
  .ty .ic{width:64px;height:64px;border-radius:50%;background:var(--primary-soft);display:flex;align-items:center;justify-content:center;font-size:30px;margin-bottom:14px;animation:pop .5s ease-out}
  @keyframes pop{from{transform:scale(.7);opacity:0}to{transform:none;opacity:1}}
  .ty h2{margin:0 0 6px;font-size:22px}.ty p{color:var(--muted);margin:0}
</style></head>
<body>
<form class="card" onsubmit="event.preventDefault();this.querySelector('.ty').classList.add('on')">
  <div class="brand">
    <svg viewBox="0 0 120 120" width="30"><rect width="120" height="120" rx="28" fill="#5E7A66"/><path d="M28 78 A32 32 0 0 1 92 78" fill="none" stroke="#F1E9DD" stroke-width="9" stroke-linecap="round"/><path d="M44 78 A16 16 0 0 1 76 78" fill="none" stroke="#D9A679" stroke-width="9" stroke-linecap="round"/><circle cx="60" cy="86" r="4.5" fill="#F1E9DD"/></svg>
    анна
  </div>
  <h1>Подключить Анну к клинике</h1>
  <p class="sub">Оставьте заявку — расскажем, как Анна возьмёт записи на себя. <span class="ph">демо · бэкенд не подключён</span></p>

  <label>Клиника</label>
  <input required placeholder="Название клиники">
  <label>Ваше имя</label>
  <input required placeholder="Как к вам обращаться">
  <label>Телефон или Telegram</label>
  <input required placeholder="+7… или @username">
  <label>Город</label>
  <input placeholder="Москва, Алматы…">
  <label>Профиль клиники</label>
  <select><option>Стоматология</option><option>Многопрофильная</option><option>Пластическая хирургия</option><option>Другое</option></select>

  <button class="btn" type="submit">Оставить заявку</button>
  <div class="promise">Каждый пациент — как самый важный. Круглосуточно.</div>

  <div class="ty">
    <div class="ic">🌿</div>
    <h2>Спасибо!</h2>
    <p>Получили заявку — скоро напишем.<br>Спокойно, как Анна.</p>
  </div>
</form>
</body></html>
